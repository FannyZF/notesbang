# Production-ish stack: Postgres + Redis + MinIO + API + Celery worker/beat
# + Next.js web + Caddy. Set PUBLIC_ORIGIN / HTTP_PORT / SITE_ADDRESS and
# secrets via .env (default public port is 8088).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notesbang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notesbang_dev}
      POSTGRES_DB: ${POSTGRES_DB:-notesbang}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-notesbang}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data

  api:
    build: ./backend
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-notesbang}:${POSTGRES_PASSWORD:-notesbang_dev}@postgres:5432/${POSTGRES_DB:-notesbang}
      REDIS_URL: redis://redis:6379/0
      TASK_BACKEND: celery
      EXEC_ASYNC: "true"
      # Object storage + slide rendering are unused by the content-scoring
      # product, so everything stays on local disk (no MinIO needed).
      STORAGE_BACKEND: local
      RENDER_SLIDES: "false"
      VISION_ENABLED: "false"
      MAIL_DRIVER: ${MAIL_DRIVER:-console}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      PUBLIC_WEB_URL: ${PUBLIC_ORIGIN:-http://localhost:8088}
      APP_BASE_URL: ${PUBLIC_ORIGIN:-http://localhost:8088}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./backend
    command: celery -A app.workers.celery_app.celery_app worker -Q jobs --loglevel=info
    environment:
      RUN_MIGRATIONS: "false"
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-notesbang}:${POSTGRES_PASSWORD:-notesbang_dev}@postgres:5432/${POSTGRES_DB:-notesbang}
      REDIS_URL: redis://redis:6379/0
      TASK_BACKEND: celery
      STORAGE_BACKEND: local
      RENDER_SLIDES: "false"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
    depends_on:
      - api

  beat:
    build: ./backend
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=info
    environment:
      RUN_MIGRATIONS: "false"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-notesbang}:${POSTGRES_PASSWORD:-notesbang_dev}@postgres:5432/${POSTGRES_DB:-notesbang}
      REDIS_URL: redis://redis:6379/0
      TASK_BACKEND: celery
      STORAGE_BACKEND: local
    depends_on:
      - redis

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: ${PUBLIC_ORIGIN:-http://localhost:8088}/api
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    ports:
      - "${HTTP_PORT:-8088}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      # ":80" serves plain HTTP for any host (IP:PORT access). For a real
      # domain with automatic HTTPS set SITE_ADDRESS=yourdomain.com.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web
      - api

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
