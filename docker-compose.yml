# Production stack: Postgres + Redis + API (FastAPI) + Celery worker/beat
# + Next.js web + Caddy. Set PUBLIC_ORIGIN / HTTP_PORT / SITE_ADDRESS and
# secrets via .env (default public port is 8088). Images are published to GHCR
# by GitHub Actions; `docker compose pull` uses them, `--build` builds locally.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notesbang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notesbang_dev}
      POSTGRES_DB: ${POSTGRES_DB:-notesbang}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-notesbang}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    restart: unless-stopped

  api:
    image: ${IMAGE_PREFIX:-ghcr.io/fannyzf}/notesbang-api:${IMAGE_TAG:-latest}
    build: ./backend
    # Explicit command so the API runs even with an image that only defines an
    # entrypoint; --forwarded-allow-ips makes Caddy's X-Forwarded-For trusted
    # (real client IPs for rate limiting).
    command: "uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*"
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-notesbang}:${POSTGRES_PASSWORD:-notesbang_dev}@postgres:5432/${POSTGRES_DB:-notesbang}
      REDIS_URL: redis://redis:6379/0
      TASK_BACKEND: celery
      EXEC_ASYNC: "true"
      # Object storage + slide rendering are unused by the content-scoring
      # product, so everything stays on local disk (no MinIO needed).
      STORAGE_BACKEND: local
      RENDER_SLIDES: "false"
      VISION_ENABLED: "false"
      MAIL_DRIVER: ${MAIL_DRIVER:-console}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      TRACK_SALT: ${TRACK_SALT:-notesbang}
      RUBRIC_VERSION: ${RUBRIC_VERSION:-v2}
      AUDIT_LLM_ENABLED: ${AUDIT_LLM_ENABLED:-true}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      PUBLIC_WEB_URL: ${PUBLIC_ORIGIN:-http://localhost:8088}
      APP_BASE_URL: ${PUBLIC_ORIGIN:-http://localhost:8088}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    image: ${IMAGE_PREFIX:-ghcr.io/fannyzf}/notesbang-api:${IMAGE_TAG:-latest}
    build: ./backend
    command: celery -A app.workers.celery_app.celery_app worker -Q jobs --loglevel=info
    restart: unless-stopped
    environment:
      RUN_MIGRATIONS: "false"
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-notesbang}:${POSTGRES_PASSWORD:-notesbang_dev}@postgres:5432/${POSTGRES_DB:-notesbang}
      REDIS_URL: redis://redis:6379/0
      TASK_BACKEND: celery
      STORAGE_BACKEND: local
      RENDER_SLIDES: "false"
      RUBRIC_VERSION: ${RUBRIC_VERSION:-v2}
      AUDIT_LLM_ENABLED: ${AUDIT_LLM_ENABLED:-true}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
    depends_on:
      - api

  beat:
    image: ${IMAGE_PREFIX:-ghcr.io/fannyzf}/notesbang-api:${IMAGE_TAG:-latest}
    build: ./backend
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=info
    restart: unless-stopped
    environment:
      RUN_MIGRATIONS: "false"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-notesbang}:${POSTGRES_PASSWORD:-notesbang_dev}@postgres:5432/${POSTGRES_DB:-notesbang}
      REDIS_URL: redis://redis:6379/0
      TASK_BACKEND: celery
      STORAGE_BACKEND: local
    depends_on:
      - redis

  web:
    image: ${IMAGE_PREFIX:-ghcr.io/fannyzf}/notesbang-web:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      args:
        # Relative base: the web app and /api share one origin via Caddy, so
        # the same image works on any domain/port without rebuilding.
        NEXT_PUBLIC_API_BASE: /api
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    ports:
      - "${HTTP_PORT:-8088}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      # ":80" serves plain HTTP for any host (IP:PORT access). For a real
      # domain with automatic HTTPS set SITE_ADDRESS=yourdomain.com.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      # Contact email for Let's Encrypt certificate notices.
      ACME_EMAIL: ${ACME_EMAIL:-yueng@qq.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
